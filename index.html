<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Yuki Neurona</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    #stage { width: 100%; height: 100%; }
    #bubble {
      position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%);
      max-width: 88%; padding: 10px 14px; border-radius: 14px;
      background: rgba(12, 14, 22, 0.82); color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; line-height: 1.35; text-align: center;
      display: none; z-index: 5; pointer-events: none;
      backdrop-filter: blur(8px);
    }
    #input-wrap {
      position: absolute; left: 12px; right: 12px; bottom: 12px;
      display: none; z-index: 6;
    }
    #chat {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(18, 20, 28, 0.92); color: #fff; font-size: 14px; outline: none;
    }
    #hint {
      position: absolute; top: 8px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,0.55); font-size: 11px; pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
    #mic-status {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      padding: 6px 12px; border-radius: 999px; z-index: 8;
      font-size: 12px; color: #fff; letter-spacing: .02em;
      background: rgba(10,12,20,.78); border: 1px solid rgba(255,255,255,.18);
      display: none; pointer-events: none; white-space: nowrap;
      text-shadow: 0 1px 2px #000;
    }
    #mic-status.show { display: block; }
    #mic-status.rec { border-color: #ff5a7a; background: rgba(90,10,30,.82); }
    #mic-status.ok { border-color: #4dff9a; }
    #mic-status.err { border-color: #ffb020; }
    #overlay {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(10,10,16,0.7); color: #eee; text-align: center; padding: 20px;
      font-size: 13px; z-index: 4; pointer-events: none;
    }
    #overlay.show { display: flex; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="overlay">Положи <b>Yuki.vrm</b> сюда<br>или ПКМ → Загрузить VRM</div>
  <div id="bubble"></div>
  <div id="input-wrap"><input id="chat" placeholder="Напиши и Enter…" /></div>
  <div id="hint">ПКМ — меню · «Юки» или ПРОБЕЛ · в игре Alt+Y</div>
  <div id="mic-status"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js"
    }
  }
  </script>
  <script type="module" src="./src/renderer.js"></script>
</body>
</html>
